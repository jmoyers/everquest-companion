[workspace]
resolver = "2"
members = [
  "crates/engined",
  "crates/eqlog",
  "crates/fold",
  "crates/knowledge",
  "crates/parity",
  "crates/protocol",
  "crates/protocol-codegen",
]

# The engine. `protocol` is the wire contract, `eqlog` parses and tails the log, `fold` is the
# twenty modules plus combat, and `engined` serves the protocol over loopback TCP and runs them.
# `parity` is the oracle that compares a fold against recorded snapshots.
#
# TWO STANDING RULES FOR EVERYTHING UNDER engine/:
#   * Nothing here may shell out to powershell.exe, ever, at build time or at run time.
#     PowerShell binaries are the antivirus trigger this app already spent a release eliminating,
#     and a Rust process spawning one would put it straight back.
#   * The engine runs at below-normal process priority (owner ruling: the person at this machine
#     is playing EverQuest). Nothing in the build may pin a core or spawn unbounded parallelism.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "FSL-1.1-MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
